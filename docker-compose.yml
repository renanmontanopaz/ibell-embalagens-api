version: '3.3'

services:
  backend:
    build:
      context: ./
    container_name: meu-app-backend-spring
    ports:
      - "8080:8080"
    networks:
      - app-net
    depends_on:
      - database
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/${SPRING_DATASOURCE_DB}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USER}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
    restart: unless-stopped

  database:
    image: postgres:14-alpine
    container_name: meu-postgres-db
    ports:
      - "5432:5432"
    networks:
      - app-net
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

networks:
  app-net:
    driver: bridge

volumes:
  postgres-data:
